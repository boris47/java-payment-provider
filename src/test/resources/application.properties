# Sun's DNS caching policy is to cache forever, which can cause problems
# if DNS entries change. This setting changes that behavior to cache for 60 seconds.
# See https://docs.oracle.com/javase/8/docs/technotes/guides/net/properties.html
# for more details.
networkaddress.cache.ttl=60

spring.profiles.active=test

spring.application.name=stripe-provider-service

server.port=8083